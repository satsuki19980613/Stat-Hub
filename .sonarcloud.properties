# SonarCloud（自動解析）の設定。https://sonarcloud.io/project/overview?id=satsuki19980613_Stat-Hub
# テスト（*.test.ts）はテストコードとして数え、本体のコードの指摘からは外す。
sonar.sources=.
# vendor/ は修正を当てた他所のライブラリの写し（vendor/deepmerge/README.md）なので解析しない
sonar.exclusions=**/*.test.ts,**/*.test.tsx,public/data/**,vendor/**
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
